name: Code Review

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - "3.4.0"
          - "4.0.0"

    steps:
      - name: ⏬️ Checkout code
        uses: actions/checkout@v6

      - name: 📦 Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: 🧪 Lint code for consistent style
        run: bin/rubocop -f github

      - name: 🧪 Run RSpec
        run: bin/rspec
